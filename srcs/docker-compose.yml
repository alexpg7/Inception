services:

  mariadb:
    image: inception-mariadb:1.0
    build:
      context: ./requirements/mariadb
    container_name: mariadb
    restart: always
    env_file:
      - .env
    secrets:
      - db_password
      - db_root_password
    volumes:
      - mariadb-data:/var/lib/mysql
    networks:
      - inception

  wordpress:
    image: inception-wordpress:1.0
    build:
      context: ./requirements/wordpress
    container_name: wordpress
    restart: always
    env_file:
      - .env
    secrets:
      - db_password
      - credentials
    volumes:
      - wordpress-data:/var/www/html
    networks:
      - inception
    depends_on:
      - mariadb

  nginx:
    image: inception-nginx:1.0
    build:
      context: ./requirements/nginx
    container_name: nginx
    restart: always
    volumes:
      - wordpress-data:/var/www/html
    ports:
      - "443:443"
    networks:
      - inception
    depends_on:
      - wordpress

networks:
  inception:
    name: inception

volumes:
  mariadb-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/alpascua/data/mariadb

  wordpress-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/alpascua/data/wordpress

secrets:
  db_password:
    file: ../secrets/db_password.txt

  db_root_password:
    file: ../secrets/db_root_password.txt

  credentials:
    file: ../secrets/credentials.txt